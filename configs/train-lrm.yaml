
experiment:
    type: lrm
    seed: 42
    parent: lrm-cbct
    child: second_full

model:
    rendering_samples_per_ray: 128
    encoder_layers: 12
    encoder_heads: 8
    encoder_dim: 384
    transformer_dim: 512
    transformer_layers: 12
    transformer_heads: 8
    triplane_low_res: 32
    triplane_high_res: 64
    triplane_dim: 32

    encoder_type: patchify_linear
    encoder_model_name: dinov2_vits14_reg
    encoder_feat_dim: 384
    encoder_freeze: false        # Keep unfrozen for better adaptation


dataset:
    subsets:
        root_dirs: './data/cone_10_norm'
        meta_path: './data/meta.json'

    render_image:
        low: 64
        high: 196
        region: 64

    input_image_res: 224
    nums_input_view: 10
    nums_target_view: 10
    num_train_workers: 96
    num_val_workers: 64
    pin_mem: true

train:
    mixed_precision: bf16  # REPLACE THIS BASED ON GPU TYPE
    find_unused_parameters: false
    loss:
        pixel_weight: 0.75
        tv_weight: 5e-4          # Added small TV regularization to prevent overfitting
        vol_mse_weight: 1.5      # Reduced from 1.0 to balance with pixel loss

    optim:
        lr: 4e-4                 # Reduced from 4e-4 for more stable training
        weight_decay: 0.02       # Reduced from 0.05 to allow more flexibility
        beta1: 0.9
        beta2: 0.95
        clip_grad_norm: 0.5      # Reduced from 1.0 for better gradient stability
    scheduler:
        type: cosine
        warmup_real_iters: 3000
    batch_size: 3 # REPLACE THIS (PER GPU)
    accum_steps: 1  # REPLACE THIS
    epochs: 20 # REPLACE THIS
    debug_global_steps: null

val:
    batch_size: 4
    global_step_period: 2000
    debug_batches: null

saver:
    auto_resume: true
    load_model: null
    checkpoint_root: ./exps/checkpoints
    checkpoint_global_steps: 1000
    checkpoint_keep_level: 5

logger:
    stream_level: WARNING
    log_level: INFO
    log_root: ./exps/logs
    tracker_root: ./exps/trackers
    enable_profiler: false
    trackers:
        - tensorboard
    image_monitor:
        train_global_steps: 200
        samples_per_log: 2

compile:
    suppress_errors: true
    print_specializations: true
    disable: true
