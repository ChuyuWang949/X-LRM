# LNDb_r: NAF/SAX-NeRF 风格的 Cone-Beam CT 配置（用于生成投影）
# - 该配置以“米（m）”为单位，并给出 sDetector/sVoxel；脚本会自动计算 dDetector/dVoxel 并转换为 DIF-Net 需要的毫米（mm）版本。
# - 额外包含 DIF-Net 生成 blocks 所需的 resolution/block_size。

resolution: [256, 256, 256]
block_size: [64, 64, 64]

# Mode & filter
mode: cone
filter: null

# System configuration (m)
DSD: 0.7
DSO: 0.5

# Detector parameters ([v, u] in TIGRE)
nDetector: [512, 512]
sDetector: [0.4, 0.4] # m

# Image parameters ([x, y, z])
nVoxel: [256, 256, 256]
sVoxel: [0.2, 0.2, 0.2] # m

# Offsets (m)
offOrigin: [0, 0, 0]
offDetector: [0, 0] # [u, v]

# Auxiliary
accuracy: 0.5

# Angles
totalAngle: 180.0
startAngle: 0.0
randomAngle: false
numTrain: 50

# Noise (SAX-NeRF 等价)
noise: true
possion_noise: 100000
gaussian_noise: [0, 0.01]
